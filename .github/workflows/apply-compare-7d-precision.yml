name: Apply Compare timeframe-precision fix
on:
  push:
    branches: [fix/compare-7d-precision-20261122]
    paths: [.github/workflows/apply-compare-7d-precision.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact Compare lookback
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path("src/App.jsx")
          raw=p.read_bytes()
          eol="\r\n" if raw.count(b"\r\n")>raw.count(b"\n")/2 else "\n"
          s=raw.decode("utf-8").replace("\r\n","\n")
          old='''  if (tf === "2Y") return "2Y";
            if (tf === "1D") return "1D"; // keep intraday fidelity
            return "1Y"; // fetch once, slice for 7D/30D/90D/1Y views'''
          new='''  if (tf === "2Y") return "2Y";
            // Use CoinGecko's native high-resolution window for short timeframes.
            // Slicing daily 1Y points into 7D can produce a misleading starting
            // price and percentage change on thinly traded assets such as JAM.
            if (["1D", "7D", "30D", "90D"].includes(tf)) return tf;
            return "1Y";'''
          assert s.count(old)==1,f"Unexpected _compareFetchRange source matches: {s.count(old)}"
          s=s.replace(old,new,1)
          p.write_bytes(s.replace("\n",eol).encode("utf-8"))
          print("7D/30D/90D Compare now request their actual lookback; EOL preserved",repr(eol))
          
          PY
          python3 /tmp/patch.py
          git diff --numstat -- src/App.jsx
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit verified UI change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fetch 7D Compare charts at native historical resolution"
          git push origin HEAD:fix/compare-7d-precision-20261122
