name: Apply Compare asset identity fix (UI)
on:
  push:
    branches: [fix/compare-asset-identity-20261122]
    paths: [.github/workflows/apply-compare-identity-ui.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted UI Compare identity patch
        shell: bash
        run: |
          cat > /tmp/patch_ui.py <<'PY'
          from pathlib import Path
          p=Path("src/App.jsx")
          s=p.read_text()
          def once(old,new):
           global s
           n=s.count(old)
           if n!=1: raise SystemExit(f"Expected one match, got {n}: {old[:100]}")
           s=s.replace(old,new,1)
          once('const LS_COMPARE_SERIES_CACHE = "na_compare_series_cache_v1";','const LS_COMPARE_SERIES_CACHE = "na_compare_series_cache_v2_identity";')
          once('const LS_COMPARE_STORE = "na_compare_store_v2";','const LS_COMPARE_STORE = "na_compare_store_v3_identity";')
          once('function _cmpKey(symbols, tf) {','function _cmpKey(symbols, tf, ids = {}) {')
          once('  const keySyms = arr.map((s) => String(s || "").toUpperCase()).filter(Boolean).sort().join(",");','  const keySyms = arr.map((s) => String(s || "").toUpperCase()).filter(Boolean).sort().map((s) => s + "=" + String(ids?.[s] || "")).join(",");')
          once('function _cmpGetCached(symbols, tf) {','function _cmpGetCached(symbols, tf, ids = {}) {')
          once('function _cmpPutCached(symbols, tf, data) {','function _cmpPutCached(symbols, tf, data, ids = {}) {')
          assert s.count('const k = _cmpKey(symbols, tf);')==2
          s=s.replace('const k = _cmpKey(symbols, tf);','const k = _cmpKey(symbols, tf, ids);')
          once('  // -------- Fixed color slots (10), stable per coin --------',"""  // Carry the exact selected Watchlist coin identity into Compare.
            const compareCoinIds = useMemo(() => {
              const out = {};
              for (const sym of compareSymbols) {
                const matches = (Array.isArray(watchItems) ? watchItems : []).filter((it) =>
                  String(it?.symbol || "").trim().toUpperCase() === sym &&
                  String(it?.mode || "market").toLowerCase() === "market"
                );
                if (matches.length !== 1) continue;
                const cid = String(matches[0]?.coingecko_id || matches[0]?.id || "").trim().toLowerCase();
                if (/^[a-z0-9][a-z0-9._-]{0,150}$/.test(cid)) out[sym] = cid;
              }
              return out;
            }, [compareSymbols.join("|"), watchItems]);
          
            // -------- Fixed color slots (10), stable per coin --------""")
          once('const cached2y = _cmpGetCached(compareSymbols, "2Y");','const cached2y = _cmpGetCached(compareSymbols, "2Y", compareCoinIds);')
          once('const cached = _cmpGetCached(compareSymbols, _compareFetchRange(timeframe));','const cached = _cmpGetCached(compareSymbols, _compareFetchRange(timeframe), compareCoinIds);')
          once('const cached = (opts.force || opts.noCache) ? null : _cmpGetCached(compareSymbols, fetchRange);','const cached = (opts.force || opts.noCache) ? null : _cmpGetCached(compareSymbols, fetchRange, compareCoinIds);')
          once('_cmpPutCached(compareSymbols, fetchRange, normalized);','_cmpPutCached(compareSymbols, fetchRange, normalized, compareCoinIds);')
          once('const qs = new URLSearchParams({ symbols: `${a},${b}`, range: PAIR_EXPLAIN_TF }).toString();','const qs = new URLSearchParams({ symbols: `${a},${b}`, range: PAIR_EXPLAIN_TF, ids: JSON.stringify(compareCoinIds) }).toString();')
          once('const qs = new URLSearchParams({ symbols: syms, range: fetchRange });','const qs = new URLSearchParams({ symbols: syms, range: fetchRange, ids: JSON.stringify(compareCoinIds) });')
          p.write_text(s)
          print("Frontend Compare identity patch applied")
          
          PY
          python3 /tmp/patch_ui.py
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit Compare identity patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Preserve explicit asset IDs in Compare requests and caches"
          git push origin HEAD:fix/compare-asset-identity-20261122
