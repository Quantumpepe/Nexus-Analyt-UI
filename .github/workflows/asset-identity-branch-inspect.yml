name: Nexus asset identity branch inspection
on:
  push:
    branches: [fix/compare-asset-identity-20261122]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace identity sources and resolver
        run: |
          git clone --depth 1 --branch fix/compare-asset-identity-20261122 https://github.com/Quantumpepe/Nexus-Analyt-Pro.git /tmp/nexus-pro
          python3 - <<'PY'
          from pathlib import Path
          import re
          a=Path('src/App.jsx').read_text().splitlines()
          b=Path('/tmp/nexus-pro/app.py').read_text().splitlines()
          def block(arr,lo,hi):
              print('---',lo,hi,'---')
              for i in range(lo-1,min(hi,len(arr))):print(f'{i+1}: {arr[i][:210]}')
          print('=== UI COMPARE STATE INDEX ===')
          for i,x in enumerate(a):
              if re.search(r'(const \[compareSymbols|setCompareSymbols|const \[watchItems|watchItems\.)',x) and 8500<i<18500: print(i+1,x[:200])
          print('=== BACKEND RESOLVER DEF INDEX ===')
          for i,x in enumerate(b):
              if re.search(r'^def _cg_resolve_symbol|^COINGECKO_KNOWN|^def _cryptocompare_histoday',x):block(b,i+1,i+75)
          for lo,hi in [(9620,9738),(9280,9320),(18170,18250)]:block(a if lo<18000 else b,lo,hi)
          PY
