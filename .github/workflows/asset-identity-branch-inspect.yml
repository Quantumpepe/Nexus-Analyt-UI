name: Nexus asset identity branch inspection
on:
  push:
    branches: [fix/compare-asset-identity-20261122]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace history identifier and frontend selection
        run: |
          git clone --depth 1 --branch fix/compare-asset-identity-20261122 https://github.com/Quantumpepe/Nexus-Analyt-Pro.git /tmp/nexus-pro
          python3 - <<'PY'
          from pathlib import Path
          import re
          a=Path('src/App.jsx').read_text().splitlines()
          b=Path('/tmp/nexus-pro/app.py').read_text().splitlines()
          def block(arr,lo,hi):
              print('---',lo,hi,'---')
              for i in range(lo-1, min(hi,len(arr))):print(f'{i+1}: {arr[i][:230]}')
          print('=== BACKEND FUNCTION DEFS ===')
          for i,line in enumerate(b):
              if re.search(r'^def (_get_series_for_symbol|_health_for_symbol|_resolve_cg_id|_cg_history|_cg_market_chart)',line):
                  print(i+1,line[:220]);block(b,max(1,i+1),min(len(b),i+75))
          print('=== UI SELECTION/FETCH ===')
          for lo,hi in [(10775,10850),(18040,18165),(9740,9785),(11275,11310)]:
              block(a,lo,hi)
          PY
