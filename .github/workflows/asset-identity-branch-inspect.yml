name: Nexus asset identity branch inspection
on:
  push:
    branches:
      - fix/compare-asset-identity-20261122
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Compare call paths
        shell: bash
        run: |
          git clone --depth 1 --branch fix/compare-asset-identity-20261122 https://github.com/Quantumpepe/Nexus-Analyt-Pro.git /tmp/nexus-pro
          python3 - <<'PY'
          from pathlib import Path
          import re
          a=Path('src/App.jsx').read_text().splitlines()
          b=Path('/tmp/nexus-pro/app.py').read_text().splitlines()
          def show(lines,lo,hi):
              for i in range(lo-1,min(hi,len(lines))):
                  print(f'{i+1}: {lines[i][:250]}')
          print('=== BACKEND SYMBOL RESOLVER ===')
          show(b,14980,15065)
          print('=== BACKEND COMPARE ROUTE ===')
          show(b,18528,18685)
          print('=== FRONTEND COMPARE FETCH SITE INDEX ===')
          for i,x in enumerate(a):
              if re.search(r'api/compare|_cmpKey\(|_cmpGetCached\(|_cmpPutCached\(',x):
                  print(f'{i+1}: {x[:250]}')
          print('=== BACKEND WATCHLIST EXPLICIT ID INDEX ===')
          for i,x in enumerate(b):
              if re.search(r'coingecko_id|_cg_id_for_symbol|_cg_symbol_to_id',x) and 14500 < i < 19000:
                  print(f'{i+1}: {x[:230]}')
          PY
