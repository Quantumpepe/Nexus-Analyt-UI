name: Inspect Compare 7D chart
on:
  push:
    branches: [fix/compare-chart-7d-jam-20261122]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted 7D Compare inspection
        shell: bash
        run: |
          cat > /tmp/inspect_compare.py <<'PY'
          from pathlib import Path
          import re
          p=Path("src/App.jsx")
          lines=p.read_text(errors="replace").splitlines()
          patterns=[
              r'function normalizeBackendSeries',
              r'function _compareFetchRange',
              r'Index 100',
              r'index100',
              r'indexMode',
              r'compareSeries',
              r'normalizeCompare',
              r'function.*CompareChart',
              r'chart.*baseline'
          ]
          printed=set()
          for pat in patterns:
              hits=[i for i,l in enumerate(lines) if re.search(pat,l,re.I)]
              print(f"=== {pat}: {len(hits)} hits ===")
              for i in hits[:8]:
                  a=max(0,i-10);b=min(len(lines),i+25)
                  for k in range(a,b):
                      if k not in printed:
                          print(f"{k+1}: {lines[k][:220]}")
                          printed.add(k)
          print("=== NEXT ===")
          
          PY
          python3 /tmp/inspect_compare.py
