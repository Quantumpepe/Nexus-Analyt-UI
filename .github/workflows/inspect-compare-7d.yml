name: Inspect Compare 7D chart
on:
  push:
    branches: [fix/compare-chart-7d-jam-20261122]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chart internals
        shell: bash
        run: |
          cat > /tmp/inspect.py <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          a=p.read_text().splitlines()
          for lo,hi in [(2430,2488),(2530,2542),(2590,2648),(18030,18055),(18140,18183),(24830,24930),(25135,25195),(11300,11360)]:
           print('===',lo,hi)
           for i in range(lo-1,hi):
            print(f'{i+1}: {a[i][:240]}')
          
          PY
          python3 /tmp/inspect.py
