name: Inspect 7D Compare pair regression
on:
  push:
    branches: [fix/compare-7d-pairs-20261122]
    paths: [.github/workflows/inspect-compare-pairs.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect precise pair data sources
        shell: bash
        run: |
          cat > /tmp/inspect.py <<'PY'
          from pathlib import Path
          a=Path("src/App.jsx").read_text(errors="replace").splitlines()
          for lo,hi in [(9710,9750),(991,1043),(11320,11358),(11420,11510),(18085,18130),(18248,18275),(3210,3265),(3300,3325)]:
           print(f"=== REGION {lo}-{hi} ===")
           for i in range(lo-1,min(hi,len(a))):print(f"{i+1}: {a[i][:250]}")
          
          PY
          python3 /tmp/inspect.py
