name: Preserve UI source line endings on fix branch
on:
  push:
    branches: [fix/compare-asset-identity-20261122]
    paths: [.github/workflows/preserve-ui-line-endings.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original line endings
        run: |
          git fetch --depth 1 origin main
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          old=subprocess.check_output(["git","show","FETCH_HEAD:src/App.jsx"])
          path=Path("src/App.jsx")
          new=path.read_bytes()
          old_crlf=old.count(bytes([13,10]))
          old_lf=old.count(bytes([10]))
          print(f"main CRLF={old_crlf}, LF={old_lf}")
          if old_crlf>old_lf//2:
              path.write_bytes(new.replace(bytes([13,10]),bytes([10])).replace(bytes([10]),bytes([13,10])))
          print("restored CRLF",path.read_bytes().count(bytes([13,10])))
          PY
          git diff --numstat FETCH_HEAD -- src/App.jsx
      - name: Commit only format preservation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Preserve original App.jsx formatting in Compare fix"
            git push origin HEAD:fix/compare-asset-identity-20261122
          fi
